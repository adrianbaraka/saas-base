x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app_binary_name-db:
    container_name: app_binary_name-db
    image: postgres:18.4
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - app_binary_name_db_data:/var/lib/postgresql
    networks:
      - internal

  app_binary_name-backend:
    image: "app_binary_name-backend:latest"
    container_name: "app_binary_name-backend"
    restart: unless-stopped
    logging: *logging
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${APP_URL}
      - DATABASE_URL=${DATABASE_URL}
      - DEFAULT_ADMIN_NAME=${DEFAULT_ADMIN_NAME}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL}
      - CACHE_MINUTES=${CACHE_MINUTES}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - SEND_EMAIL=${SEND_EMAIL}
    volumes:
      - ${DATA_DIR:?DATA_DIR not set}:/data
    depends_on:
      app_binary_name-db:
        condition: service_healthy
    ports:
      - 8000:8000
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/health || exit 1",
        ]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 5

  app_binary_name-frontend:
    image: "app_binary_name-frontend:latest"
    container_name: "app_binary_name-frontend"
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PUBLIC_FRONTEND_URL=${APP_URL}
      - ORIGIN=${APP_URL}
      - BACKEND_URL=${BACKEND_URL}
      # - ADDRESS_HEADER=${ADDRESS_HEADER}
      # - XFF_DEPTH=${XFF_DEPTH}
    depends_on:
      app_binary_name-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "healthCheck.ts"]
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - internal

networks:
  internal:

volumes:
  app_binary_name_db_data:
